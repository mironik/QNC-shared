# The blocks QNC and QNC-AI share (user 2026-11-12: "kocke su shared, zajednicke; ako neka
# aplikacija trazi promjenu kocke, originalna ostaje, a ta aplikacija u svoj direktorij ukljucuje
# promijenjenu kocku"). With them, the contracts they build in (texts, keys, input maps, layouts of
# the editorial and the shell, databases, module contracts, catalogs): one truth for both. Each
# application takes them by path (../QNC-shared) and keeps its own GUI and its changed blocks.
[workspace]
resolver = "2"
members = ["crates/*"]
# Built only with the `libav` feature of a program (needs the FFmpeg development files).
exclude = ["crates/qnc-libav-decode"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
